name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Placeholder values so eager module-eval guards (Better Auth
          # identity DB + OAuth) don't throw during page-data collection.
          # The build never opens a DB connection; postgres-js is lazy.
          AUTH_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder

      # The build passes even when the edge middleware cannot load a module;
      # only a request shows it, so start the app and hit a few routes.
      - name: Smoke test
        run: |
          pnpm start -p 3123 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3123/api/health && break; sleep 1; done
          fail=0
          for p in / /login /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "http://localhost:3123$p")
            echo "$p $code"
            if [ "$code" = "000" ] || [ "$code" = "500" ]; then fail=1; fi
          done
          if grep -qE 'Failed to load external module|Native module not found' server.log; then fail=1; fi
          pkill -f next-server || true
          [ "$fail" = 0 ] || { cat server.log; exit 1; }
        env:
          AUTH_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime
          GOOGLE_CLIENT_ID: ci-placeholder
          GOOGLE_CLIENT_SECRET: ci-placeholder
